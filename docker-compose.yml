services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      # This line makes Actual available at port 5006 of the device you run the server on,
      # i.e. http://localhost:5006. You can change the first number to change the port, if you want.
      - '5006:5006'
    #environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - ./actual-data:/data
      - ./certs:/certs
    environment:
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    extra_hosts:
      - "api.pluggy.ai:172.28.0.3"
    networks:
      custom_net:
        ipv4_address: 172.28.0.2
    depends_on:
      - ahorratron-sync-api
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ahorratron-sync-api:
    image: ahorratron:latest
    ports:
      - '9443:443'
    env_file:
      - .env
    volumes:
      - ./certs:/certs
    command: |
      sh -c '
        if [ ! -f /certs/cert.pem ]; then
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /certs/key.pem \
            -out /certs/cert.pem \
            -days 365 \
            -subj "/CN=api.pluggy.ai";
        fi;
        uv run uvicorn ahorratron.sync_api.main:app --host 0.0.0.0 --port 443 --ssl-keyfile /certs/key.pem --ssl-certfile /certs/cert.pem
      '
    networks:
      custom_net:
        ipv4_address: 172.28.0.3

  selenium:
    image: selenium/standalone-chromium:latest
    ports:
      - "4444:4444"   # Selenium WebDriver
      - "7900:7900"   # noVNC browser access
      - "5900:5900"   # VNC client access
    shm_size: 2gb
    # environment:
      # - SE_START_XVFB=true   # Ensures graphical mode (not headless)
      # - SE_VNC_PASSWORD=secret  # Default VNC password
    networks:
      custom_net:
        ipv4_address: 172.28.0.4

networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16


