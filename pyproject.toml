[project]
name = "ahorratron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.0",
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "actualpy>=0.0.1",
]

[project.scripts]
convert-to-actual = "ahorratron.cli.convert_to_actual:main"
ahorratron-api = "ahorratron.api.main:run_server"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.25.0",
    "pre-commit>=4.2.0",
]

[tool.setuptools]
packages = ["ahorratron"]

[tool.uv]
package = true

[tool.ruff.lint]
# Ignore E731 (lambda assignment)
ignore = ["E731"]


