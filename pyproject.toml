[project]
name = "ahorratron"
version = "26.7.0.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.12.0,<3.0.0",
    "selenium>=4.34.2",
    "httpx>=0.28.1",
    "python-jose>=3.5.0",
    "cachetools>=6.1.0",
    "pycryptodome>=3.23.0",
    "cryptography>=45.0.4",
]

[project.scripts]
ahorratron-api = "ahorratron.actual_api.main:run_server"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.25.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.403",
    "ruff>=0.15.14",
]

[tool.setuptools]
packages = ["ahorratron"]

[tool.uv]
package = true
exclude-newer = "1 week"

[tool.ruff]
fix = true
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "UP", # modernize python
    "RUF", # ruff specific rules
    "I", # isort
]
extend-ignore = [
    "E731" # lambda assignment
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on calling Depends()/Query()/etc.
# as argument defaults; this is the documented way to opt B008 out for them.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
