[project]
name = "ahorratron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.3.0",
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.1.0",
    "actualpy>=0.0.1",
    "selenium>=4.34.2",
    "xlrd>=2.0.2",
    "httpx>=0.28.1",
    "python-jose>=3.5.0",
    "cachetools>=6.1.0",
]

[project.scripts]
bank-statement = "ahorratron.conversor.cli.bank_statement:main"
convert-to-actual = "ahorratron.conversor.cli.convert_to_actual:main"
ahorratron-api = "ahorratron.actual_api.main:run_server"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.25.0",
    "pre-commit>=4.2.0",
    "pandas-stubs>=2.3.0.250703",
    "pyright>=1.1.403",
    "ruff>=0.14.8",
]

[tool.setuptools]
packages = ["ahorratron"]

[tool.uv]
package = true

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = [
    "UP", # modernize python
    "RUF", # ruff specific rules
]
extend-ignore = [
    "E731" # lambda assignment
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
