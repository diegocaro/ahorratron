[project]
name = "ahorratron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.0",
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "actualpy>=0.0.1",
    "selenium>=4.34.2"
]

[project.scripts]
bank-statement = "ahorratron.cli.bank_statement:main"
convert-to-actual = "ahorratron.cli.convert_to_actual:main"
ahorratron-api = "ahorratron.api.main:run_server"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.25.0",
    "pre-commit>=4.2.0",
    "mypy>=1.17.0",
    "pandas-stubs>=2.3.0.250703",
    "pylint>=3.3.7",
]

[tool.setuptools]
packages = ["ahorratron"]

[tool.uv]
package = true

[tool.ruff.lint]
# Ignore E731 (lambda assignment)
ignore = ["E731"]

#[tool.pyright]
#venvPath = "."
#venv = ".venv"
#typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["actual", "actual.queries"]
ignore_missing_imports = true


[tool.pylint.'MAIN']
disable = ["C3001", # allow lambda expression
] 
